[project]
name = "cashcove"
version = "0.2.6"
description = "Self-hosted personal finance and budgeting API"
requires-python = ">=3.13"
dependencies = [
    "aiosmtplib>=5.1.3",
    "alembic>=1.20.0",
    "email-validator>=2.3.0",
    "fastapi>=0.143.0",
    # Talks to Plaid's API (plaid-python is only published as a source package, and the image
    # installs prebuilt wheels only).
    "httpx2>=2.13.1",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
    "pyotp>=2.10.0",
    "pypdf>=6.20.0",
    "sqlalchemy>=2.1.3",
    "uvicorn[standard]>=0.54.0",
    "webauthn>=3.0.1",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "mypy>=2.4.0",
    "pip-audit>=2.10.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]
# Only in the e2e image, which measures what the Playwright tests cover of the API.
e2e = ["coverage>=7.16.2"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov --cov-report=term-missing --cov-report=xml --cov-fail-under=99"

[tool.coverage.run]
branch = true
# The API (app/) and the end-to-end test harness (e2e/). Measuring from backend/ itself makes
# coverage.xml name files app/… and e2e/…, so SonarQube can tell same-named modules apart.
source = ["."]
omit = ["tests/*", "migrations/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests assert, and use made-up passwords and tokens.
"tests/**" = ["S101", "S105", "S106"]
# The end-to-end tests' baseline data has made-up passwords and tokens too.
"e2e/baseline.py" = ["S105", "S106"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pyright]
include = ["app", "e2e", "tests", "migrations", "../docker"]
typeCheckingMode = "strict"
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
