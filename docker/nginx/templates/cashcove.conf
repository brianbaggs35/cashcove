# Rendered at startup by entrypoint.sh; ${CASHCOVE_*} placeholders are filled from the
# environment. nginx's own $variables are left untouched.

# Plain HTTP only ever redirects to the one HTTPS address Cashcove answers on, whatever
# Host header the request carried.
server {
    listen 8080 default_server;
    server_name _;

    location / {
        return 301 https://${CASHCOVE_SERVER_NAME}${CASHCOVE_HTTPS_PORT_SUFFIX}$request_uri;
    }
}

# A TLS connection that doesn't ask for Cashcove by name (an IP scan, a DNS-rebinding
# page) is refused during the handshake, before any request is read.
server {
    listen 8443 ssl default_server;
    ssl_reject_handshake on;
}

server {
    listen 8443 ssl;
    http2 on;
    # The configured name, plus localhost for the container's own healthcheck.
    server_name ${CASHCOVE_SERVER_NAMES};

    ssl_certificate ${CASHCOVE_TLS_CERT};
    ssl_certificate_key ${CASHCOVE_TLS_KEY};

    # Mozilla "modern" profile: TLS 1.3 only, with OpenSSL's default key exchange groups.
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:TLS:10m;
    ssl_session_tickets off;

    include /etc/nginx/cashcove/security-headers.conf;

    # Sign-in, setup and account security (where passwords, codes and passkeys are
    # checked) get a much tighter per-address limit, not counting GET requests, and small
    # bodies. The API also locks out an account after repeated wrong answers.
    location /api/auth/ {
        limit_req zone=auth burst=20 nodelay;
        client_max_body_size 64k;
        include /etc/nginx/cashcove/api-proxy.conf;
    }

    location /api/account/ {
        limit_req zone=auth burst=20 nodelay;
        client_max_body_size 64k;
        include /etc/nginx/cashcove/api-proxy.conf;
    }

    location /api/ {
        include /etc/nginx/cashcove/api-proxy.conf;
    }

    include /etc/nginx/cashcove/app.conf;
}
