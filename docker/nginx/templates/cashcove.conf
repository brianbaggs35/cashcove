# Rendered at startup by entrypoint.sh; ${CASHCOVE_*} placeholders are filled from the
# environment. nginx's own $variables are left untouched.

server {
    listen 8080;
    server_name ${CASHCOVE_SERVER_NAME};

    location / {
        return 301 https://$host${CASHCOVE_HTTPS_PORT_SUFFIX}$request_uri;
    }
}

server {
    listen 8443 ssl;
    http2 on;
    server_name ${CASHCOVE_SERVER_NAME};

    ssl_certificate ${CASHCOVE_TLS_CERT};
    ssl_certificate_key ${CASHCOVE_TLS_KEY};

    # Mozilla "intermediate" profile.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ecdh_curve X25519:prime256v1:secp384r1;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:TLS:10m;
    ssl_session_tickets off;

    include /etc/nginx/cashcove/security-headers.conf;

    location /api/ {
        limit_req zone=api burst=40 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;

        include /etc/nginx/cashcove/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    include /etc/nginx/cashcove/app.conf;
}
