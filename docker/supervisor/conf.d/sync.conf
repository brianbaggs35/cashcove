; Syncs connected banks on the schedule chosen in Settings > Sync (see app/plaid/worker.py).
; On SIGTERM it finishes the sync in hand before it stops.
[program:sync]
command=python -m app.plaid.worker
directory=/app/backend
user=cashcove
environment=HOME="/app"
priority=25
autorestart=true
startsecs=5
stopwaitsecs=90
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
