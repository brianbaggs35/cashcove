# Temporary: prints SonarQube Cloud's open findings on master and on this pull request into
# the log, for fixing them from a sandbox that can't reach sonarcloud.io. Removed again in
# the commit that fixes them.
name: SonarQube findings

on:
  pull_request:

permissions:
  contents: read

jobs:
  findings:
    name: SonarQube findings
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: List them
        env:
          API: https://sonarcloud.io/api
          PROJECT: brianbaggs35_cashcove
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: |
          get() { curl -sS "$API/$1"; }
          for scope in "branch=master" "pullRequest=$PULL_REQUEST"; do
            echo "==== $scope"
            get "issues/search?componentKeys=$PROJECT&$scope&issueStatuses=OPEN,CONFIRMED&ps=1&facets=impactSoftwareQualities,impactSeverities,types" \
              | jq -c '{total, errors, facets}'
            echo "== Security and reliability issues"
            get "issues/search?componentKeys=$PROJECT&$scope&issueStatuses=OPEN,CONFIRMED&impactSoftwareQualities=SECURITY,RELIABILITY&ps=500" \
              | jq -r '.errors[]?.msg, (.issues[]? | "\(.component | sub("^[^:]*:"; "")):\(.line // "-") | \(.rule) | \([.impacts[]? | "\(.softwareQuality)/\(.severity)"] | join(",")) | \(.message)")'
            echo "== Security hotspots to review"
            get "hotspots/search?projectKey=$PROJECT&$scope&status=TO_REVIEW&ps=500" \
              | jq -r '.errors[]?.msg, (.hotspots[]? | "\(.component | sub("^[^:]*:"; "")):\(.line // "-") | \(.ruleKey) | \(.vulnerabilityProbability) | \(.message)")'
          done
