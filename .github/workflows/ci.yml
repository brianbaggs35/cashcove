# Checks every pull request and every push to master. Each job mirrors a `make` target,
# so anything that fails here can be reproduced locally with `make lint`, `make test`,
# `make audit` and `make e2e`.
name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned to full commit SHAs so a moved or hijacked tag can't change what runs.
jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: cashcove
          POSTGRES_PASSWORD: cashcove
          POSTGRES_DB: cashcove
        ports:
          - 5432:5432
        # Check over TCP so the check can't pass while the init scripts' socket-only server runs.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U cashcove"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # Same Python as the container image.
          python-version: "3.14"
          working-directory: backend

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check --output-format=github . ../docker

      - name: Ruff format
        run: uv run ruff format --check . ../docker

      - name: Pyright
        run: uv run pyright

      - name: Mypy
        run: uv run mypy app e2e tests migrations

      - name: Bandit
        run: uv run bandit -c pyproject.toml -r app e2e migrations ../docker

      - name: Dependency audit
        run: uv run pip-audit

      - name: Tests with 100% coverage
        run: uv run pytest

      - name: Migrations on Postgres 18
        env:
          CASHCOVE_DATABASE_URL: postgresql+psycopg://cashcove:cashcove@127.0.0.1:5432/cashcove
        run: |
          uv run alembic upgrade head
          # Fails if the models have changes no migration covers.
          uv run alembic check
          uv run alembic downgrade base
          uv run alembic upgrade head

      # The same tests again on the database the app really runs on (after the migration
      # checks, because the tests replace the schema with the models' own).
      - name: Tests on Postgres 18
        env:
          CASHCOVE_TEST_DATABASE_URL: postgresql+psycopg://cashcove:cashcove@127.0.0.1:5432/cashcove
        run: uv run pytest --no-cov -p no:cacheprovider

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Same Node as the image's frontend build stage.
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: ESLint
        run: npm run lint -- --max-warnings=0

      - name: Prettier
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Tests with 100% coverage
        run: npm run coverage

      - name: Dependency audit
        run: npm audit

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: ignore
          retention-days: 14

  container:
    name: Container
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CASHCOVE_VERSION: ci
      CASHCOVE_HTTPS_PORT: 8443
      CASHCOVE_HTTP_PORT: 8080
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Hadolint, ShellCheck and actionlint
        run: make lint-infra

      - name: Trivy scan of dependencies, secrets and the Dockerfile
        run: make scan-source

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Today's date, to refresh cached OS packages daily
        id: date
        run: echo "today=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          load: true
          tags: cashcove:ci
          build-args: APK_REFRESH=${{ steps.date.outputs.today }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan of the image
        run: make scan-image

      - name: Password for the smoke test's admin
        run: |
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          echo "CASHCOVE_SMOKE_PASSWORD=$password" >> "$GITHUB_ENV"

      - name: Start the stack
        run: docker compose up --detach --no-build --wait --wait-timeout 180

      - name: Smoke test
        run: ./.github/scripts/smoke-test.sh

      - name: Restart on the existing data
        run: |
          docker compose down
          docker compose up --detach --no-build --wait --wait-timeout 180
          ./.github/scripts/smoke-test.sh

      - name: Container logs
        if: ${{ failure() }}
        run: docker compose logs --no-color

      - name: Stop the stack
        if: ${{ always() }}
        run: docker compose down --volumes

  e2e:
    name: End-to-end
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Today's date, to refresh cached OS packages daily
        id: date
        run: echo "today=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      # The production image plus the test harness (the Dockerfile's e2e target).
      - name: Build the test server
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: e2e
          load: true
          tags: cashcove:e2e
          build-args: APK_REFRESH=${{ steps.date.outputs.today }}
          cache-from: |
            type=gha
            type=gha,scope=e2e
          cache-to: type=gha,scope=e2e,mode=max

      - name: Start the test server
        working-directory: .
        run: docker compose -f docker-compose.e2e.yml up --detach --no-build --wait --wait-timeout 180

      - name: Playwright tests with coverage
        run: npm run e2e

      - name: Upload the report and coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-results
          path: frontend/e2e-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Test server logs
        if: ${{ failure() }}
        working-directory: .
        run: docker compose -f docker-compose.e2e.yml logs --no-color

      - name: Stop the test server
        if: ${{ always() }}
        working-directory: .
        run: docker compose -f docker-compose.e2e.yml down --volumes

  # SonarQube Cloud: bugs, code smells, security hotspots, duplication and coverage, held to
  # its quality gate. It needs the SONAR_TOKEN secret (README.md, Code quality); without it,
  # as on pull requests from forks, the job is skipped.
  sonarqube:
    name: SonarQube
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Check for the SonarQube token
        if: ${{ env.SONAR_TOKEN == '' }}
        run: echo "::notice::SONAR_TOKEN isn't set, so the SonarQube analysis was skipped."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ env.SONAR_TOKEN != '' }}
        with:
          # The full history, so SonarQube can tell new code from old.
          fetch-depth: 0
          persist-credentials: false

      - name: Download the backend's coverage
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backend-coverage
          path: backend

      - name: Download the frontend's coverage
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-coverage
          path: frontend/coverage

      # Settings are in sonar-project.properties.
      - name: SonarQube analysis and quality gate
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        with:
          args: -Dsonar.qualitygate.wait=true

      # When the quality gate fails, list the new code's open issues and unreviewed security
      # hotspots here too, so they can be fixed without opening SonarQube Cloud.
      - name: What SonarQube found
        if: ${{ failure() && env.SONAR_TOKEN != '' }}
        env:
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.ref_name }}
        run: |
          project="$(sed -n 's/^sonar\.projectKey=//p' sonar-project.properties)"
          if [ -n "$PULL_REQUEST" ]; then
            scope="pullRequest=$PULL_REQUEST"
          else
            scope="branch=$BRANCH&sinceLeakPeriod=true"
          fi
          sonar() {
            curl -sS -H "Authorization: Bearer $SONAR_TOKEN" "https://sonarcloud.io/api/$1&$scope&ps=500"
          }
          echo "Open issues in new code:"
          sonar "issues/search?componentKeys=$project&issueStatuses=OPEN,CONFIRMED" | jq -r '.errors[]?.msg,
            (.issues[]? | "  \(.component | sub("^[^:]*:"; "")):\(.line // "-")  \(.rule)  \(.message)")'
          echo "Security hotspots to review:"
          sonar "hotspots/search?projectKey=$project&status=TO_REVIEW" | jq -r '.errors[]?.msg,
            (.hotspots[]? | "  \(.component | sub("^[^:]*:"; "")):\(.line // "-")  \(.ruleKey)  \(.message)")'
