# Checks every pull request and every push to master. Each job mirrors a `make` target,
# so anything that fails here can be reproduced locally with `make lint`, `make test`
# and `make audit`.
name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned to full commit SHAs so a moved or hijacked tag can't change what runs.
jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: cashcove
          POSTGRES_PASSWORD: cashcove
          POSTGRES_DB: cashcove
        ports:
          - 5432:5432
        # Check over TCP so the check can't pass while the init scripts' socket-only server runs.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U cashcove"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # Same Python as the container image.
          python-version: "3.14"
          working-directory: backend

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check --output-format=github . ../docker

      - name: Ruff format
        run: uv run ruff format --check . ../docker

      - name: Pyright
        run: uv run pyright

      - name: Mypy
        run: uv run mypy app tests migrations

      - name: Bandit
        run: uv run bandit -c pyproject.toml -r app migrations ../docker

      - name: Dependency audit
        run: uv run pip-audit

      - name: Tests with 100% coverage
        run: uv run pytest

      - name: Migrations on Postgres 18
        env:
          CASHCOVE_DATABASE_URL: postgresql+psycopg://cashcove:cashcove@127.0.0.1:5432/cashcove
        run: |
          uv run alembic upgrade head
          # Fails if the models have changes no migration covers.
          uv run alembic check
          uv run alembic downgrade base
          uv run alembic upgrade head

      # The same tests again on the database the app really runs on (after the migration
      # checks, because the tests replace the schema with the models' own).
      - name: Tests on Postgres 18
        env:
          CASHCOVE_TEST_DATABASE_URL: postgresql+psycopg://cashcove:cashcove@127.0.0.1:5432/cashcove
        run: uv run pytest --no-cov -p no:cacheprovider

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Same Node as the image's frontend build stage.
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: ESLint
        run: npm run lint -- --max-warnings=0

      - name: Prettier
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Tests with 100% coverage
        run: npm run coverage

      - name: Dependency audit
        run: npm audit

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: ignore
          retention-days: 14

  container:
    name: Container
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CASHCOVE_VERSION: ci
      CASHCOVE_HTTPS_PORT: 8443
      CASHCOVE_HTTP_PORT: 8080
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Hadolint, ShellCheck and actionlint
        run: make lint-infra

      - name: Trivy scan of dependencies, secrets and the Dockerfile
        run: make scan-source

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Today's date, to refresh cached OS packages daily
        id: date
        run: echo "today=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          load: true
          tags: cashcove:ci
          build-args: APK_REFRESH=${{ steps.date.outputs.today }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan of the image
        run: make scan-image

      - name: Password for the smoke test's admin
        run: |
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          echo "CASHCOVE_SMOKE_PASSWORD=$password" >> "$GITHUB_ENV"

      - name: Start the stack
        run: docker compose up --detach --no-build --wait --wait-timeout 180

      - name: Smoke test
        run: ./.github/scripts/smoke-test.sh

      - name: Restart on the existing data
        run: |
          docker compose down
          docker compose up --detach --no-build --wait --wait-timeout 180
          ./.github/scripts/smoke-test.sh

      - name: Container logs
        if: ${{ failure() }}
        run: docker compose logs --no-color

      - name: Stop the stack
        if: ${{ always() }}
        run: docker compose down --volumes
