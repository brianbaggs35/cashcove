# Builds the production image and publishes it to GitHub's container registry
# (ghcr.io/<owner>/<repo>) when a release is published. GitHub doesn't run workflows for
# draft releases, so publishing the draft is what starts it. The release's tag, e.g. v1.4.0,
# names the image and is the version Settings > System shows.
#
# Pull requests that change the image or this workflow get a dry run: everything is built
# and tested, nothing is published.
name: Release

on:
  release:
    types: [published]
  pull_request:
    paths:
      - Dockerfile
      - .github/workflows/release.yml

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned to full commit SHAs so a moved or hijacked tag can't change what runs.
jobs:
  test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
      today: ${{ steps.version.outputs.today }}
    env:
      CASHCOVE_VERSION: release
      CASHCOVE_HTTPS_PORT: 8443
      CASHCOVE_HTTP_PORT: 8080
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version from the release's tag
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
          PULL_REQUEST: ${{ github.event.number }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = release ]; then
            version="${TAG#v}"
          else
            version="0.0.0-pr.${PULL_REQUEST}"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tags need to be versions like v1.4.0 or v2.0.0-rc.1, not '$TAG'."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "today=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the image for this machine
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          load: true
          tags: cashcove:release
          build-args: |
            APK_REFRESH=${{ steps.version.outputs.today }}
            RELEASE=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=release
          cache-to: type=gha,scope=release,mode=max

      - name: Trivy scan of the image
        run: make scan-image

      - name: Password for the smoke test's admin
        run: |
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          echo "CASHCOVE_SMOKE_PASSWORD=$password" >> "$GITHUB_ENV"

      - name: Smoke test
        env:
          CASHCOVE_SMOKE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker compose up --detach --no-build --wait --wait-timeout 180
          ./.github/scripts/smoke-test.sh

      - name: Container logs
        if: ${{ failure() }}
        run: docker compose logs --no-color

      - name: Stop the container
        if: ${{ always() }}
        run: docker compose down --volumes

      # Also for 64-bit ARM (a Raspberry Pi 4 or 5, many NAS boxes, Apple silicon), under
      # emulation. Nothing is pushed; this fills the cache the publish job builds from.
      - name: Build the image for every platform
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          build-args: |
            APK_REFRESH=${{ steps.version.outputs.today }}
            RELEASE=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=release
          cache-to: type=gha,scope=release,mode=max

  publish:
    name: Publish
    needs: test
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      # Signing the build provenance with GitHub's attestations.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Image name
        id: image
        # Registry names are lowercase.
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1.4.0, 1.4 and 1 for a release (no bare 0 before 1.0), plus latest unless it's marked
      # as a pre-release. Pre-release versions like 2.0.0-rc.1 only get their own tag.
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ needs.test.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.test.outputs.version }}
            type=semver,pattern={{major}},value=${{ needs.test.outputs.version }},enable=${{ !startsWith(needs.test.outputs.version, '0.') }}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}
          labels: |
            org.opencontainers.image.title=Cashcove
            org.opencontainers.image.description=Self-hosted personal finance

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            APK_REFRESH=${{ needs.test.outputs.today }}
            RELEASE=${{ needs.test.outputs.version }}
          # A software bill of materials and how the image was built, stored with it.
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=release

      - name: Attest the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
