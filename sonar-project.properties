# SonarQube Cloud analysis, run by the SonarQube job in .github/workflows/ci.yml. Setting it
# up is in README.md (Code quality); the organization and project keys must match
# SonarQube Cloud's.
sonar.organization=brianbaggs35
sonar.projectKey=brianbaggs35_cashcove
sonar.projectName=Cashcove
sonar.sourceEncoding=UTF-8

# What ships: the API and its migrations, the web app, and the container's Dockerfile and
# scripts. Also the CI and release workflows and their scripts, which build and publish it.
sonar.sources=backend/app,backend/migrations,frontend/src,docker,Dockerfile,.github
sonar.exclusions=frontend/src/**/*.spec.ts,frontend/src/test/**

# Tests and test tooling, checked with the rules for tests: the unit tests and the web app's
# test helpers, the Playwright tests, and the end-to-end test harness (backend/e2e), which
# only the test image built by `make e2e` contains.
sonar.tests=backend/tests,backend/e2e,frontend/src,frontend/e2e
sonar.test.inclusions=backend/tests/**,backend/e2e/**,frontend/src/**/*.spec.ts,frontend/src/test/**,frontend/e2e/**

sonar.python.version=3.14
# Written by pytest and vitest in the Backend and Frontend jobs, which require 100%.
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
# Everything else is measured. These have no unit tests: the migrations, which the Backend
# job runs up and down on Postgres, and the container's and CI's scripts, which the
# Container job runs.
sonar.coverage.exclusions=backend/migrations/**,docker/**,.github/**

# Postgres has no password on purpose: it only listens on the container's unix socket and
# trusts the operating system's user (peer auth), so there's no password to leak.
sonar.issue.ignore.multicriteria=peerauth
sonar.issue.ignore.multicriteria.peerauth.ruleKey=python:S2115
sonar.issue.ignore.multicriteria.peerauth.resourceKey=backend/app/config.py
