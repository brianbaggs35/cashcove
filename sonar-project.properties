# SonarQube Cloud analysis, run by the SonarQube job in .github/workflows/ci.yml. Setting it
# up is in README.md (Code quality); the organization and project keys must match
# SonarQube Cloud's.
sonar.organization=brianbaggs35
sonar.projectKey=brianbaggs35_cashcove
sonar.projectName=Cashcove

sonar.sources=backend/app,backend/e2e,backend/migrations,frontend/src,docker,Dockerfile
sonar.tests=backend/tests,frontend/src,frontend/e2e
sonar.test.inclusions=backend/tests/**,frontend/src/**/*.spec.ts,frontend/src/test/**,frontend/e2e/**
sonar.exclusions=frontend/src/**/*.spec.ts,frontend/src/test/**

sonar.python.version=3.14
# Written by pytest and vitest in the Backend and Frontend jobs.
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
# Migrations and the container's scripts have no unit tests; the Container job runs them.
sonar.coverage.exclusions=backend/migrations/**,docker/**
